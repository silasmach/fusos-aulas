<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotofácil Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎱</text></svg>">
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1d1a2b;--mut:#6b6880;--pri:#7b2cbf;--bd:#e4e0ef;--ok:#1b8a5a;--ball:#efe9fa}
@media(prefers-color-scheme:dark){:root{--bg:#14121c;--card:#1e1b2b;--tx:#ece9f7;--mut:#9a96b0;--pri:#b583f0;--bd:#2e2a42;--ok:#4cd197;--ball:#2a2540}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 16px;background:var(--pri);color:#fff}header h1{margin:0;font-size:18px}header small{opacity:.85}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0}
nav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff}
main{max-width:860px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.warn{border-left:4px solid #e0a800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:13px;color:var(--mut)}input,select,textarea,button.go{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.go{background:var(--pri);color:#fff;border:0;cursor:pointer;margin-top:8px}
.balls{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.b{width:28px;height:28px;border-radius:50%;background:var(--ball);display:grid;place-items:center;font-size:12px;font-weight:600}
.b.f{background:var(--pri);color:#fff}.b.h{background:var(--ok);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;font-size:12px;width:100%}td,th{padding:3px 5px;text-align:center;border-bottom:1px solid var(--bd)}
td.s{background:var(--pri);color:#fff;border-radius:4px}td.l{text-align:left;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}.k{font-size:22px;font-weight:700}
</style>
</head>
<body>
<header><h1>🎱 Lotofácil Lab</h1><small id="sub">carregando…</small></header>
<nav id="nav"></nav>
<main>
<div class="card warn mut">⚠️ Ferramenta de análise e organização de jogos, <b>não de previsão</b>. Cada sorteio é independente do histórico: a chance de qualquer jogo de 15 dezenas é 1 em 3.268.760. Use a aba <b>Backtest</b> para medir se o método supera o acaso.</div>
<div id="v"></div>
</main>
<script src="core.js"></script>
<script>
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
let H=[],M=[],tab='painel',ult=null;
const TABS={painel:'Painel',gerar:'Gerar jogos',conferir:'Conferir',backtest:'Backtest',dados:'Dados'};
$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
const balls=(a,f=[],h=[])=>`<div class="balls">${a.map(d=>`<span class="b ${h.includes(d)?'h':f.includes(d)?'f':''}">${pad(d)}</span>`).join('')}</div>`;
const num=s=>(s||'').split(/[\s,;]+/).filter(Boolean).map(Number).filter(n=>n>=1&&n<=25);
const cicloDe=()=>H[0].c===1?null:H[Math.max(0,H.length-4)].c;
function load(t,fonte){H=parseCSV(t);M=matriz(H);const u=H[H.length-1];
  $('#sub').textContent=`${fonte} · ${H.length} concursos · último ${u.c} (${u.d})`;render()}
fetch('historico.csv').then(r=>r.text()).then(t=>load(t,'historico.csv')).catch(()=>{tab='dados';render();$('#v').insertAdjacentHTML('afterbegin','<div class="card">Não consegui ler <code>historico.csv</code> (abrir direto do disco bloqueia isso). Publique no GitHub Pages ou carregue um CSV abaixo.</div>')});

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(!H.length&&tab!=='dados')return;
  ({painel,gerar,conferir,backtest:bt,dados})[tab]();
}
function painel(){
  const cf=cicloDe(),cy=ciclos(H,cf),{sc,info}=scores(M,M.length,cy.falt),u=H[H.length-1],ord=ordenar(sc);
  const ult10=M.slice(-10),hd=H.slice(-10).map(r=>`<th>${r.c%100}</th>`).join('');
  const lin=ALL.map(d=>`<tr><td class="l"><b>${pad(d)}</b></td>${ult10.map(m=>`<td class="${m[d-1]?'s':''}">${m[d-1]?'●':''}</td>`).join('')}<td class="l mut">${info[d-1].est} (${info[d-1].sIn}/${info[d-1].sOut})</td></tr>`).join('');
  $('#v').innerHTML=`<div class="card"><b>Concurso ${u.c}</b> <span class="mut">${u.d}</span>${balls(u.n)}</div>
  <div class="card grid"><div><div class="k">${cy.pos}</div><div class="mut">concursos no ciclo atual</div></div>
  <div><div class="k">${cy.falt.size===25?'novo':cy.falt.size}</div><div class="mut">${cy.falt.size===25?'ciclo recém-fechado':'dezenas faltando'}</div></div>
  <div><div class="k">${cy.closed.length?cy.closed.slice(-1)[0][1]:'–'}</div><div class="mut">tam. do último ciclo</div></div></div>
  ${cf?`<div class="card warn mut">Histórico incompleto: ciclo contado a partir do concurso ${cf}. Rode o workflow de atualização para o histórico completo.</div>`:''}
  ${cy.falt.size<25?`<div class="card"><b>Faltam no ciclo</b>${balls([...cy.falt])}</div>`:''}
  <div class="card"><b>Ranking de dezenas</b> <span class="mut">(heurística dos vídeos)</span>${balls(ord,ord.slice(0,6))}</div>
  <div class="card tw"><b>Movimentação (últimos 10)</b><table><tr><th></th>${hd}<th>estado (seq/falha)</th></tr>${lin}</table></div>`;
}
function gerar(){
  $('#v').innerHTML=`<div class="card"><div class="grid">
  <div><label>Modo</label><select id="m"><option value="fc84">FC84 · 4 jogos / 19 dz · 15 pts*</option><option value="fc79">FC79 · 4 jogos / 18 dz · 15 pts*</option><option value="fc35">FC35 · 18 jogos / 18 dz · 14 pts*</option><option value="fc17">17 dz · 8 jogos · 14 pts*</option><option value="livre">Livre (com filtros)</option></select></div>
  <div><label>Custo por jogo (R$)</label><input id="c" type="number" step=".5" value="3.5"></div></div>
  <div class="grid"><div><label>Fixar dezenas (livre)</label><input id="fx" placeholder="ex: 16 6"></div>
  <div><label>Excluir dezenas</label><input id="ex" placeholder="ex: 7 10"></div>
  <div><label>Nº de jogos (livre)</label><input id="n" type="number" value="10"></div></div>
  <button class="go" id="go">Gerar</button><p class="mut">* garantia condicional: só vale se o resultado cair dentro da estrutura escolhida.</p></div><div id="out"></div>`;
  $('#go').onclick=()=>{const cy=ciclos(H,cicloDe()),modo=$('#m').value,fix=num($('#fx').value),excl=num($('#ex').value),custo=+$('#c').value;
    const r=construir(modo,H,M,M.length,cy.falt,{fix,excl,n:+$('#n').value}),ant=H[H.length-1].n;
    localStorage.setItem('ult',JSON.stringify({modo,jogos:r.jogos,base:H[H.length-1].c}));
    const fx=r.meta.fixas||[],meta=r.meta.grupos?'Grupos: '+r.meta.grupos.map((g,i)=>`G${i+1}[${g.map(pad)}]`).join(' '):'';
    $('#out').innerHTML=`<div class="card mut">Base: até o concurso ${H[H.length-1].c}. Fixas: ${fx.map(pad).join(' ')||'–'}. ${meta}</div>`+
      r.jogos.map((j,i)=>{const s=statsJogo(j,ant);return `<div class="card"><b>Jogo ${i+1}</b> <span class="mut">ímp ${s.impares} · rep ${s.repetidas} · mold ${s.moldura} · soma ${s.soma}</span>${balls(j,fx)}</div>`}).join('')+
      `<div class="card"><b>${r.jogos.length} jogos · R$ ${(r.jogos.length*custo).toFixed(2)}</b><button class="go" id="cp">Copiar jogos</button></div>`;
    $('#cp').onclick=()=>navigator.clipboard.writeText(r.jogos.map(j=>j.map(pad).join(' ')).join('\n')).then(()=>$('#cp').textContent='Copiado ✓');};
}
function conferir(){
  const s=JSON.parse(localStorage.getItem('ult')||'null');
  $('#v').innerHTML=`<div class="card"><label>Concurso</label><input id="cn" type="number" value="${H[H.length-1].c}">
  <label>Jogos (um por linha)</label><textarea id="jg" rows="6">${s?s.jogos.map(j=>j.map(pad).join(' ')).join('\n'):''}</textarea><button class="go" id="go">Conferir</button></div><div id="out"></div>`;
  $('#go').onclick=()=>{const r=H.find(x=>x.c===+$('#cn').value);if(!r){$('#out').innerHTML='<div class="card">Concurso não está no histórico.</div>';return}
    const js=$('#jg').value.split('\n').map(num).filter(j=>j.length===15),h=acertos(js,r.n);
    $('#out').innerHTML=`<div class="card"><b>Resultado ${r.c}</b>${balls(r.n)}<div class="mut">melhor: ${Math.max(...h)} · premiados (11+): ${h.filter(k=>k>=11).length}</div></div>`+js.map((j,i)=>`<div class="card"><b>Jogo ${i+1}: ${h[i]} pontos</b>${balls(j,[],r.n)}</div>`).join('')};
}
function bt(){
  $('#v').innerHTML=`<div class="card"><div class="grid"><div><label>Modo</label><select id="m"><option value="fc84">FC84</option><option value="fc79">FC79</option><option value="fc35">FC35</option><option value="fc17">17 dz</option><option value="livre">Livre</option></select></div>
  <div><label>Começar no concurso nº</label><input id="i" type="number" value="500"></div><div><label>Custo/jogo (R$)</label><input id="c" type="number" step=".5" value="3.5"></div></div>
  <button class="go" id="go">Rodar backtest</button><p class="mut">Em cada concurso o sistema usa só dados anteriores. Compara com o esperado ao acaso (hipergeométrica exata). Prêmios de 14 e 15 pts são estimativas.</p></div><div id="out"></div>`;
  $('#go').onclick=()=>{if(H.length<300){$('#out').innerHTML='<div class="card">Histórico curto: atualize os dados (workflow) antes.</div>';return}
    $('#out').innerHTML='<div class="card">Calculando…</div>';
    setTimeout(()=>{const m=$('#m').value,r=backtest(m,H,+$('#i').value,+$('#c').value);
      $('#out').innerHTML=`<div class="card"><b>${m.toUpperCase()}</b> · ${r.concursos} concursos · ${r.jogos} jogos<div class="k">${r.media.toFixed(3)} <span class="mut" style="font-size:14px">acertos/jogo (acaso: 9,000)</span></div>
      <div>z = <b>${r.z>0?'+':''}${r.z.toFixed(2)}</b> <span class="mut">${Math.abs(r.z)<2?'→ indistinguível do acaso':'→ desconfie de erro ou ajuste excessivo antes de acreditar'}</span></div>
      <div class="tw"><table><tr><th></th><th>sistema</th><th>acaso</th></tr>${[11,12,13,14,15].map(k=>`<tr><td>≥ ${k} pts</td><td>${(r.taxa[k]*100).toFixed(4)}%</td><td>${(r.esp[k]*100).toFixed(4)}%</td></tr>`).join('')}
      <tr><td>retorno</td><td>R$ ${Math.round(r.ret).toLocaleString('pt-BR')}</td><td>R$ ${Math.round(r.retAcaso).toLocaleString('pt-BR')}</td></tr></table></div></div>`},30)};
}
function dados(){
  $('#v').innerHTML=`<div class="card"><b>Carregar CSV</b><p class="mut">Formato: <code>concurso,data,d1…d15</code> (igual ao <code>historico.csv</code> do repositório).</p><input type="file" id="f" accept=".csv"></div>
  <div class="card mut">Os resultados vêm exclusivamente da Caixa: o workflow <code>atualizar.yml</code> consulta a API oficial todo dia e atualiza o <code>historico.csv</code> do repositório.</div>`;
  $('#f').onchange=e=>e.target.files[0].text().then(t=>{load(t,'arquivo local');tab='painel';render()});
}
</script>
</body>
</html>
